<div class="landing-shell">
  <!-- Fixed KORA logo -->
  <app-navbar />

  <!-- Right Floating Section Progress Dots -->
  <app-scroll-nav-dots />

  <!-- Top Subtle Scroll Progress Line -->
  <div class="landing-shell__progress-bar" aria-hidden="true">
    <div
      class="landing-shell__progress-fill"
      [style.transform]="'scaleX(' + scrollStore.scrollProgress() + ')'"
    ></div>
  </div>

  <!-- Full-Screen Smooth Snap Scroll Viewport -->
  <main
    #scrollContainer
    class="landing-shell__viewport"
    (scroll)="onContainerScroll()"
  >
    <!-- Section 0: Hero -->
    <div
      #sectionSlot
      class="landing-shell__section"
      [class.landing-shell__section--current]="scrollStore.activeSectionIndex() === 0"
      data-section-index="0"
    >
      <app-hero-section
        [isActive]="isSectionRevealed(0)"
        [progress]="getSectionProgress(0)"
      />
    </div>

    <!-- Section 1: DNA -->
    <div
      #sectionSlot
      class="landing-shell__section"
      [class.landing-shell__section--current]="scrollStore.activeSectionIndex() === 1"
      data-section-index="1"
    >
      <app-dna-section
        [isActive]="isSectionRevealed(1)"
        [progress]="getSectionProgress(1)"
      />
    </div>

    <!-- Section 2: Identity -->
    <div
      #sectionSlot
      class="landing-shell__section"
      [class.landing-shell__section--current]="scrollStore.activeSectionIndex() === 2"
      data-section-index="2"
    >
      <app-identity-section
        [isActive]="isSectionRevealed(2)"
        [progress]="getSectionProgress(2)"
      />
    </div>

    <!-- Section 3: Footballs -->
    <div
      #sectionSlot
      class="landing-shell__section"
      [class.landing-shell__section--current]="scrollStore.activeSectionIndex() === 3"
      data-section-index="3"
    >
      <app-footballs-section
        [isActive]="isSectionRevealed(3)"
        [progress]="getSectionProgress(3)"
      />
    </div>

    <!-- Section 4: Handball -->
    <div
      #sectionSlot
      class="landing-shell__section"
      [class.landing-shell__section--current]="scrollStore.activeSectionIndex() === 4"
      data-section-index="4"
    >
      <app-handball-section
        [isActive]="isSectionRevealed(4)"
        [progress]="getSectionProgress(4)"
      />
    </div>

    <!-- Section 5: Handball Balls -->
    <div
      #sectionSlot
      class="landing-shell__section"
      [class.landing-shell__section--current]="scrollStore.activeSectionIndex() === 5"
      data-section-index="5"
    >
      <app-handball-balls-section
        [isActive]="isSectionRevealed(5)"
        [progress]="getSectionProgress(5)"
      />
    </div>

    <!-- Section 6: Footer / Newsletter -->
    <div
      #sectionSlot
      class="landing-shell__section"
      [class.landing-shell__section--current]="scrollStore.activeSectionIndex() === 6"
      data-section-index="6"
    >
      <app-footer-section
        [isActive]="isSectionRevealed(6)"
        [progress]="getSectionProgress(6)"
      />
    </div>
  </main>
</div>
