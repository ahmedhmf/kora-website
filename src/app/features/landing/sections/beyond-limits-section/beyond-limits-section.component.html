<section
  class="beyond"
  [class.beyond--active]="isActive()"
  aria-label="Beyond Limits Zero Gravity Tech"
>
  <app-section-meta
    [codeLabel]="content().sectionCode"
    [numberLabel]="content().sectionNumber"
    [isActive]="isActive()"
  />

  <div class="beyond__mesh" aria-hidden="true">
    <div class="beyond__blob beyond__blob--1"></div>
    <div class="beyond__blob beyond__blob--2"></div>
    <div class="beyond__blob beyond__blob--3"></div>
    <div class="beyond__diagonal-streak"></div>
  </div>

  <div class="beyond__container">
    <div class="beyond__header">
      <h2 class="beyond__headline">{{ content().headline }}</h2>
    </div>

    <div class="beyond__middle-row">
      <figure class="beyond__portrait-card" [style.transform]="portraitOffset()">
        <app-optimized-image
          class="beyond__portrait-img"
          [asset]="content().responsiveInsetPortrait"
        />
      </figure>
    </div>

    <div class="beyond__bottom-row">
      <div class="beyond__feature">
        <p class="beyond__feature-text">{{ content().leftFeatureDescription }}</p>
      </div>

      <div class="beyond__right-action">
        <p class="beyond__micro-copy">{{ content().rightMicroCopy }}</p>
        <app-pill-button
          [label]="content().ctaLabel"
          variant="frosted"
          (actionTriggered)="onShopNow()"
        />
      </div>
    </div>
  </div>

  <div class="beyond__seam" aria-hidden="true"></div>
</section>
