<section id="dna" class="dna" [class.dna--active]="isActive()" aria-label="KORA DNA — Performance with purpose">
  <div class="dna__image-wrap" [style.transform]="imageTransform()">
    <img class="dna__image" src="/assets/kora/2nd.webp" alt="Exploded KORA match ball showing grip skin, rebound core, flight frame and airlock construction" loading="lazy" />
  </div>

  <div class="dna__overlay">
    <p class="dna__eyebrow">DNA</p>

    <div class="dna__content">
      <h2 class="dna__headline">
        <span class="dna__line dna__line--1">PERFORMANCE</span>
        <span class="dna__line dna__line--2">WITH</span>
        <span class="dna__line dna__line--3">PURPOSE</span>
      </h2>
      <p class="dna__description">From construction and materials to colours, graphics, surface textures, manufacturing and testing, every detail matters. We bring design and performance together to create products that look different, feel right and deliver where it matters.</p>
    </div>
  </div>
</section>
