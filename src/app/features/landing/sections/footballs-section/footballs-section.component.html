<section id="footballs" class="impact" [class.impact--active]="isActive()" aria-label="KORA performance footballs">
  <div class="impact__backdrop" [style.transform]="frameTransform()">
    <picture>
      <source media="(max-width: 768px)" srcset="/assets/kora/mobile/4.webp" />
      <img class="impact__bg-image" src="/assets/kora/4th.webp" alt="Three KORA performance footballs in red, blue and bronze colorways" loading="lazy" />
    </picture>
  </div>

  <img class="impact__stamp" src="/assets/kora/football-stamp.png" alt="Designed in Egypt, engineered in Germany — KORA performance ball specification" loading="lazy" />

  <div class="impact__content">
    <h2 class="impact__eyebrow">FOOTBALL RANGE</h2>
    <p class="impact__mobile-spec" aria-label="KORA performance ball specification">DESIGNED<br />IN EGYPT<br />ENGINEERED<br />IN GERMANY<br /><small>0.7 - 1.0 BAR / 10.2 - 14.5 PSI</small></p>
    <ul class="impact__features" aria-label="Football performance features">
      <li>Reduced-drag flight</li>
      <li>Precision flight stability</li>
      <li>Haptic-responsive touch</li>
      <li>Optimized energy rebound</li>
      <li>Turbocharged Acceleration</li>
    </ul>
  </div>
</section>
