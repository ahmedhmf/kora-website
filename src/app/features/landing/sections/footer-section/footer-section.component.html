<footer id="contact" class="footer" [class.footer--active]="isActive()" aria-label="KORA newsletter and contact">
  <div id="newsletter" class="footer__newsletter">
    <h2 class="footer__headline">STAY INFORMED AND SAVE MONEY!</h2>
    <p class="footer__intro">Be the first to know about new products and<br class="footer__desktop-break" /> promotions. Plus 15% discount!</p>
    <form class="footer__signup-form" (submit)="onSubscribe($event)">
      <label class="footer__consent">
        <input type="checkbox" [checked]="consented()" (change)="onConsentChange($event)" required />
        <span>I have read and understood the privacy policy.</span>
      </label>
      <label class="footer__email-label" for="kora-newsletter-email">Email address</label>
      <input id="kora-newsletter-email" class="footer__email-input" type="email" name="newsletter-email" placeholder="name@example.com" autocomplete="email" [value]="newsletterEmail()" (input)="onNewsletterEmailInput($event)" required />
      <button class="footer__subscribe" type="submit">SUBSCRIBE</button>
      @if (newsletterStatus()) { <p class="footer__signup-status" role="status">{{ newsletterStatus() }}</p> }
    </form>
  </div>
  <div class="footer__panel">
    <form class="footer__form" (submit)="onContact($event)">
      <label for="kora-contact-name">Full Name</label>
      <input id="kora-contact-name" type="text" name="name" autocomplete="name" [value]="name()" (input)="onFieldInput($event, 'name')" required />
      <label for="kora-contact-email">Email</label>
      <input id="kora-contact-email" type="email" name="email" autocomplete="email" [value]="email()" (input)="onFieldInput($event, 'email')" required />
      <label for="kora-contact-message">Message</label>
      <textarea id="kora-contact-message" name="message" rows="6" [value]="contactMessage()" (input)="onFieldInput($event, 'message')" required></textarea>
      <button type="submit">Send</button>
      @if (status()) { <p class="footer__status" role="status">{{ status() }}</p> }
    </form>
    <div class="footer__details">
      <img src="/assets/kora/Logo.svg" class="footer__logo" alt="KORA" loading="lazy" />
      <address>
        <a href="mailto:info@korafc.com">info&#64;korafc.com</a>
        <span>Germany Office.</span>
        <a href="tel:+4917632249421">+49 176 322 49421</a>
        <span>Egypt Office</span>
        <a href="tel:+201020138899">+20 102 013 8899</a>
      </address>
      <span class="footer__social" aria-label="KORA social handle">@</span>
    </div>
  </div>
</footer>
