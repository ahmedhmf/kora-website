<footer id="newsletter" class="footer" [class.footer--active]="isActive()" aria-label="KORA newsletter">
  <div class="footer__container">
    <div class="footer__newsletter">
      <h2 class="footer__headline">STAY INFORMED AND SAVE MONEY!</h2>
      <p class="footer__intro">Be the first to know about new products and<br class="footer__desktop-break" /> promotions. Plus 15% discount!</p>

      <form class="footer__form" (submit)="onSubscribe($event)">
        <label class="footer__consent">
          <input type="checkbox" [checked]="consented()" (change)="onConsentChange($event)" required />
          <span>I have read and understood the privacy policy.</span>
        </label>
        <label class="footer__email-label" for="kora-newsletter-email">Email address</label>
        <input
          id="kora-newsletter-email"
          class="footer__email-input"
          type="email"
          name="email"
          placeholder="name@example.com"
          autocomplete="email"
          [value]="email()"
          (input)="onEmailInput($event)"
          required
        />
        <button class="footer__submit" type="submit">SUBSCRIBE</button>
        @if (message()) {
          <p class="footer__message" role="status">{{ message() }}</p>
        }
      </form>
      <nav class="footer__discover" aria-label="Explore KORA">
        <a routerLink="/about">About KORA</a>
        <a routerLink="/footballs">Footballs</a>
        <a routerLink="/handballs">Handballs</a>
        <a routerLink="/technology">Technology</a>
      </nav>
    </div>
  </div>
</footer>
