<section id="handball-balls" class="handball-balls" [class.handball-balls--active]="isActive()" aria-label="KORA handball products">
  <div class="handball-balls__backdrop" [style.transform]="imageTransform()">
    <picture>
      <source media="(max-width: 768px)" srcset="/assets/kora/mobile/6.webp" />
      <img class="handball-balls__image" src="/assets/kora/6th.webp" alt="Two KORA performance handballs in red-blue and green colorways" loading="lazy" />
    </picture>
  </div>

  <img class="handball-balls__stamp" src="/assets/kora/handball-stamp.png" alt="Designed in Egypt, engineered in Germany — KORA performance ball specification" loading="lazy" />

  <div class="handball-balls__content">
    <h2 class="handball-balls__eyebrow">HANDBALL RANGE</h2>
    <ul class="handball-balls__features" aria-label="Handball construction features">
      <li>Engineered non-slip surface for grip and control.</li>
      <li>Multi-layer PULSEFOAM® for softness and rebound.</li>
      <li>Zero-Wing latex bladder for shape stability and air retention.</li>
      <li>32-panel Hand-stitched construction for durability.</li>
      <li>Resin compatibility.</li>
    </ul>
  </div>
</section>
