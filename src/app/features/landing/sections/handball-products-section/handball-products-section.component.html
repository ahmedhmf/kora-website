<section class="handball-products" [class.handball-products--active]="isActive()" aria-label="KORA handball products">
  <div class="handball-products__backdrop" [style.transform]="imageTransform()">
    <img class="handball-products__image" src="/assets/kora/6th.webp" alt="Two KORA performance handballs in red-blue and green colorways" loading="lazy" />
  </div>

  <div class="handball-products__content">
    <h2 class="handball-products__eyebrow">HANDBALL</h2>
    <ul class="handball-products__features" aria-label="Handball construction features">
      <li>Engineered non-slip surface for grip and control.</li>
      <li>Multi-layer PULSEFOAM® for softness and rebound.</li>
      <li>Zero-Wing latex bladder for shape stability and air retention.</li>
      <li>32-panel Hand-stitched construction for durability.</li>
      <li>Resin compatibility.</li>
    </ul>
  </div>
</section>
