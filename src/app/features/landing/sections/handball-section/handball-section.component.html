<section id="handball" class="beyond" [class.beyond--active]="isActive()" aria-label="KORA handball — more than a game">
  <div class="beyond__split">
    <div class="beyond__left"></div>
    <div class="beyond__right">
      <div class="beyond__image-wrap" [style.transform]="portraitOffset()">
        <picture>
          <source media="(max-width: 768px)" srcset="/assets/kora/mobile/5.webp" />
          <img class="beyond__image" src="/assets/kora/5th.webp" alt="Handball athlete captured in a high-energy motion study" loading="lazy" />
        </picture>
      </div>
    </div>
  </div>

  <div class="beyond__content">
    <div class="beyond__statement">
      <p class="beyond__eyebrow">HANDBALL</p>
      <h2 class="beyond__headline">MORE THAN<br />A GAME.</h2>
      <p class="beyond__description">A game of explosive movement, physical battles and split-second decisions. Driven by the team, defined by the intensity. KORA® develops performance Handballs for those who leave everything on the court.</p>
    </div>
  </div>
</section>
