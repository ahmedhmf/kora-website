<section id="hero" class="hero" [class.hero--active]="isActive()" aria-label="KORA match balls">
  <div class="hero__backdrop" [style.transform]="parallaxTransform()">
    <picture>
      <source media="(max-width: 768px)" srcset="/assets/kora/mobile/1.webp" />
      <img class="hero__image" src="/assets/kora/Home.webp" alt="KORA footballer in motion" fetchpriority="high" />
    </picture>
  </div>
  <div class="hero__grid" aria-hidden="true"></div>
  <div class="hero__container">
    <div class="hero__headline-group">
      <h1 class="hero__title">MATCH BALLS</h1>
      <p class="hero__subtitle">Designed in Egypt, Engineered in Germany</p>
      <p class="hero__description">KORA® IS A FOOTBALL CREATIVE LAB<br />MAKING PERFORMANCE BALLS AND CULTURAL WEAR.</p>
    </div>
  </div>
</section>
