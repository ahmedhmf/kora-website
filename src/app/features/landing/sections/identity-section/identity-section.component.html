<section id="identity" class="peak" [class.peak--active]="isActive()" aria-label="KORA identity — culture, performance, expression">
  <div class="peak__split">
    <div class="peak__left"></div>
    <div class="peak__right">
      <div class="peak__portrait-wrap" [style.transform]="rightPortraitTransform()">
        <img class="peak__portrait" src="/assets/kora/3rd.webp" alt="Red and black KORA football culture artwork" loading="lazy" />
      </div>
    </div>
  </div>

  <div class="peak__content">
    <p class="peak__eyebrow">IDENTITY</p>
    <div class="peak__statement">
      <div class="peak__statement-row">
        <h2 class="peak__headline-line">CULTURE,</h2>
        <p class="peak__annotation">RAW FOOTBALL CULTURE</p>
      </div>
      <div class="peak__statement-row">
        <h2 class="peak__headline-line">PERFORMANCE,</h2>
        <p class="peak__annotation">Made to play</p>
      </div>
      <div class="peak__statement-row">
        <h2 class="peak__headline-line">EXPRESSION.</h2>
        <p class="peak__annotation">INDEPENDENT CREATIVE EXPRESSION</p>
      </div>
    </div>
  </div>
</section>
