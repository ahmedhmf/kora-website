<section class="inner-power" [class.inner-power--active]="isActive()" aria-label="KORA DNA — Performance with purpose">
  <div class="inner-power__image-wrap" [style.transform]="imageTransform()">
    <img class="inner-power__image" src="/assets/kora/2nd.webp" alt="Exploded KORA match ball showing grip skin, rebound core, flight frame and airlock construction" loading="lazy" />
  </div>

  <div class="inner-power__overlay">
    <p class="inner-power__eyebrow">DNA</p>

    <div class="inner-power__content">
      <h2 class="inner-power__headline">
        <span class="inner-power__line inner-power__line--1">PERFORMANCE</span>
        <span class="inner-power__line inner-power__line--2">WITH</span>
        <span class="inner-power__line inner-power__line--3">PURPOSE</span>
      </h2>
      <p class="inner-power__description">From construction and materials to colours, graphics, surface textures, manufacturing and testing, every detail matters. We bring design and performance together to create products that look different, feel right and deliver where it matters.</p>
    </div>
  </div>
</section>
