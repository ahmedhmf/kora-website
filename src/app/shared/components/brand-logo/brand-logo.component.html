<div class="brand-logo" [class]="'brand-logo--' + size()">
  <svg
    class="brand-logo__mark"
    viewBox="0 0 36 32"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <!-- Top row: 3 dots/facets -->
    <circle cx="6" cy="6" r="3.4" fill="currentColor" />
    <circle cx="18" cy="6" r="3.4" fill="currentColor" />
    <circle cx="30" cy="6" r="3.4" fill="currentColor" />
    <!-- Middle row: 2 dots/facets -->
    <circle cx="12" cy="16" r="3.4" fill="currentColor" />
    <circle cx="24" cy="16" r="3.4" fill="currentColor" />
    <!-- Bottom vertex: 1 dot/facet -->
    <circle cx="18" cy="26" r="3.4" fill="currentColor" />
  </svg>

  @if (showWordmark()) {
    <span class="brand-logo__wordmark">{{ wordmark() }}</span>
  }
</div>
