<div
  class="orbital"
  [class]="'orbital--' + variant()"
  [class.orbital--active]="isActive()"
  aria-hidden="true"
>
  @switch (variant()) {
    @case ('hero') {
      <svg class="orbital__svg" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice">
        <!-- Upper right intersecting orbit -->
        <circle cx="1220" cy="180" r="340" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
        <!-- Lower right wide orbit -->
        <ellipse cx="1180" cy="640" rx="480" ry="210" stroke="rgba(255,255,255,0.24)" stroke-width="1" />
        <!-- Sweeping arc across bottom right -->
        <path
          d="M 690 900 C 780 560, 1080 410, 1440 460"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"
        />
        <!-- Vertex nodes -->
        <circle class="orbital__node" cx="905" cy="310" r="3" fill="#ffffff" />
        <circle class="orbital__node" cx="965" cy="452" r="3.2" fill="#ffffff" />
        <circle class="orbital__node" cx="1290" cy="435" r="2.8" fill="#ffffff" />
        <circle class="orbital__node" cx="760" cy="610" r="2.8" fill="#ffffff" />
      </svg>
    }
    @case ('split-right') {
      <svg class="orbital__svg" viewBox="0 0 720 900" fill="none" preserveAspectRatio="xMidYMid slice">
        <path
          d="M 180 -40 C 370 260, 510 580, 420 940"
          stroke="rgba(255,255,255,0.24)"
          stroke-width="1"
        />
        <circle cx="620" cy="460" r="410" stroke="rgba(255,255,255,0.16)" stroke-width="1" />
        <circle class="orbital__node" cx="316" cy="245" r="2.8" fill="#ffffff" />
        <circle class="orbital__node" cx="412" cy="518" r="3" fill="#ffffff" />
        <circle class="orbital__node" cx="436" cy="765" r="2.8" fill="#ffffff" />
      </svg>
    }
    @case ('split-left') {
      <svg class="orbital__svg" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice">
        <ellipse
          cx="820"
          cy="470"
          rx="540"
          ry="340"
          transform="rotate(-14 820 470)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"
        />
        <circle class="orbital__node" cx="348" cy="368" r="2.8" fill="#ffffff" />
        <circle class="orbital__node" cx="1185" cy="245" r="2.8" fill="#ffffff" />
        <circle class="orbital__node" cx="1295" cy="510" r="3" fill="#ffffff" />
      </svg>
    }
    @default {
      <svg class="orbital__svg" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice">
        <circle cx="720" cy="450" r="520" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
        <circle class="orbital__node" cx="240" cy="250" r="2.6" fill="#ffffff" />
        <circle class="orbital__node" cx="1200" cy="650" r="2.6" fill="#ffffff" />
      </svg>
    }
  }
</div>
