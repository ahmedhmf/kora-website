<div class="spotlight">
  <button type="button" class="spotlight__header" (click)="onExplore()">
    <span>{{ spotlight().tag }}</span>
    <span aria-hidden="true">↗</span>
  </button>

  <article class="spotlight__card" (click)="onExplore()">
    <figure class="spotlight__avatar">
      <app-optimized-image [asset]="spotlight().responsiveAvatar" />
    </figure>
    <p class="spotlight__title">{{ spotlight().name }}</p>
    <p class="spotlight__quote">{{ spotlight().quote }}</p>
  </article>
</div>
